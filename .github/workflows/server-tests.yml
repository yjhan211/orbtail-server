name: Server Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - 'server.sln'
      - 'network/Common/csv/**'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - 'server.sln'
      - 'network/Common/csv/**'
      - '.github/workflows/server-tests.yml'

jobs:
  test:
    name: dotnet test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore server.sln

      - name: Sync Unity CSV mirrors
        run: |
          mkdir -p client/Assets/Resources/Common/csv
          mkdir -p client/Assets/StreamingAssets/Common/csv
          cp network/Common/csv/*.csv client/Assets/Resources/Common/csv/
          cp network/Common/csv/*.csv client/Assets/StreamingAssets/Common/csv/

      - name: Build
        run: dotnet build server.sln --no-restore --configuration Release

      - name: Run regression tests
        run: dotnet test demo_regression_tests/demo_regression_tests.csproj --no-build --configuration Release --verbosity normal

      - name: Restore Redis integration tests
        run: dotnet restore redis_integration_tests/redis_integration_tests.csproj

      - name: Build Redis integration tests
        run: dotnet build redis_integration_tests/redis_integration_tests.csproj --no-restore --configuration Release

      - name: Run Redis integration tests
        env:
          MANITTO_RUN_REDIS_INTEGRATION_TESTS: "1"
          MANITTO_REDIS_TEST_CONNECTION: "127.0.0.1:6379,abortConnect=false,connectTimeout=3000,asyncTimeout=3000"
        run: dotnet test redis_integration_tests/redis_integration_tests.csproj --no-build --configuration Release --verbosity normal
