# 로컬 디버깅용 인프라 (Redis + NATS만 실행)
# 사용법: docker compose -f docker-compose.infra.yml up -d
services:
  redis:
    image: redis:7-alpine
    container_name: manitto-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: manitto-nats-dev
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-m 8222 -js --store_dir /data"
    volumes:
      - nats-data-dev:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data-dev:
  nats-data-dev:
