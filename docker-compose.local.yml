services:
  redis:
    image: redis:7-alpine
    container_name: manitto-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:latest
    container_name: manitto-nats-dev
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-m 8222"

  game_server:
    build:
      context: .
      dockerfile: Dockerfile.game_server.dev
    container_name: manitto-game-server-dev
    ports:
      - "8080:8080"
      - "9001:9001"
      - "9090:9090"
    volumes:
      # Mount source code for hot reload
      - ./game_server:/App/game_server:rw
      - ./network:/App/network:rw
      # Exclude bin and obj directories to avoid conflicts
      - /App/game_server/bin
      - /App/game_server/obj
      - /App/network/bin
      - /App/network/obj
    environment:
      - serverType=GameServer
      - gameServerNum=2
      - gameServerId=game-server-0
      - redisEndPoints=redis:6379
      - natsEndPoint=nats://nats:4222
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # #79 RNG 채집 시연/테스트용 — 모든 게임 종료 트리거 차단. 운영/시연 빌드에서는 제거
      - DISABLE_GAME_END=1
      # #129 선물 수동 테스트 — 실플레이어 2명 + 봇 3명, 신청 순서대로 1번→2번 타겟 고정
      - TEST_TWO_PLAYER_MATCH=0
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  user_server:
    build:
      context: .
      dockerfile: Dockerfile.user_server.dev
    container_name: manitto-user-server-dev
    ports:
      - "7000:7000"
      - "8081:8080"
      - "9091:9090"
    volumes:
      # Mount source code for hot reload
      - ./user_server:/App/user_server:rw
      - ./network:/App/network:rw
      # Exclude bin and obj directories to avoid conflicts
      - /App/user_server/bin
      - /App/user_server/obj
      - /App/network/bin
      - /App/network/obj
    environment:
      - serverType=UserServer
      - gameServerNum=2
      - servicePort=7000
      - redisEndPoints=redis:6379
      - natsEndPoint=nats://nats:4222
      - GAME_SERVER_IP=${GAME_SERVER_IP:-127.0.0.1}
      - GAME_SERVER_PORT=${GAME_SERVER_PORT:-9001}
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # #129 선물 수동 테스트 — 실플레이어 2명 + 봇 3명, 신청 순서대로 1번→2번 타겟 고정
      - TEST_TWO_PLAYER_MATCH=0
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  ops_server:
    build:
      context: .
      dockerfile: ops_server/Dockerfile
    container_name: manitto-ops-server-dev
    ports:
      - "5000:8080"
    environment:
      - GameServerUrl=http://game_server:8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - game_server
      - user_server
    restart: unless-stopped

volumes:
  redis-data-dev:
