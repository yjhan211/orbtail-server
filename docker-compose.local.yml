services:
  redis:
    image: redis:7-alpine
    container_name: manitto-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:latest
    container_name: manitto-nats-dev
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: "-m 8222"

  game_server:
    build:
      context: .
      dockerfile: Dockerfile.game_server.dev
    container_name: manitto-game-server-dev
    ports:
      - "8080:8080"
      - "9001:9001"
      - "9090:9090"
    volumes:
      # Mount source code for hot reload
      - ./game_server:/App/game_server:rw
      - ./network:/App/network:rw
      # Exclude bin and obj directories to avoid conflicts
      - /App/game_server/bin
      - /App/game_server/obj
      - /App/network/bin
      - /App/network/obj
      - match-summary-data-dev:/App/match-summaries
    environment:
      - serverType=GameServer
      - gameServerNum=2
      - gameServerId=game-server-0
      - redisEndPoints=redis:6379
      - natsEndPoint=nats://nats:4222
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # #79 RNG 채집 시연/테스트용 — 모든 게임 종료 트리거 차단. 운영/시연 빌드에서는 제거
      - DISABLE_GAME_END=${DISABLE_GAME_END:-0}
      # Survivor Royale 로컬: 실플레이어 1명 + 봇 7명 (1이면 실플레이어 2명 + 봇 6명)
      - TEST_TWO_PLAYER_MATCH=${TEST_TWO_PLAYER_MATCH:-0}
      # 교차사격 샌드박스 (#232): 1이면 전원 운동장 스폰 + 더미 봇 1 + 나머지 봇 퇴장 + 몹 접촉 무해
      - DEV_CROSSFIRE_SANDBOX=${DEV_CROSSFIRE_SANDBOX:-0}
      # 몹 스폰 끄기 (촬영·PvP 검증용): 1이면 잔상을 전혀 세우지 않는다. 봇·폐쇄·전투는 그대로
      - DEV_NO_MONSTERS=${DEV_NO_MONSTERS:-0}
      # 탐사 모드: 1이면 1인 매치 + 봇·몹 전부 비활성 (맵 검증용)
      - SOLO_MAP_VALIDATION=${SOLO_MAP_VALIDATION:-0}
      # 탐사 모드에서 캠프 몹만 되살림 (봇 없이 몹 상대 검증)
      - SOLO_MONSTERS=${SOLO_MONSTERS:-0}
      # 절단 가독성 실험: 1이면 운동장에 정지·불사 더미 1명을 자동 배치
      - DEV_CUT_DUMMY=${DEV_CUT_DUMMY:-0}
      - MATCH_SUMMARY_DIRECTORY=/App/match-summaries
      - MATCH_SUMMARY_MAX_FILES=50
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  user_server:
    build:
      context: .
      dockerfile: Dockerfile.user_server.dev
    container_name: manitto-user-server-dev
    ports:
      - "7000:7000"
      - "8081:8080"
      - "9091:9090"
    volumes:
      # Mount source code for hot reload
      - ./user_server:/App/user_server:rw
      - ./network:/App/network:rw
      # Exclude bin and obj directories to avoid conflicts
      - /App/user_server/bin
      - /App/user_server/obj
      - /App/network/bin
      - /App/network/obj
    environment:
      - serverType=UserServer
      - gameServerNum=2
      - servicePort=7000
      - redisEndPoints=redis:6379
      - natsEndPoint=nats://nats:4222
      - GAME_SERVER_IP=${GAME_SERVER_IP:-192.168.0.167}
      - GAME_SERVER_PORT=${GAME_SERVER_PORT:-9001}
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - FORCE_PLAYER_JOB=${FORCE_PLAYER_JOB:-}
      - FORCE_PLAYER_SPAWN_AREA=${FORCE_PLAYER_SPAWN_AREA:-}
      # Survivor Royale 로컬: 실플레이어 1명 + 봇 7명 (1이면 실플레이어 2명 + 봇 6명)
      - TEST_TWO_PLAYER_MATCH=${TEST_TWO_PLAYER_MATCH:-0}
      # 교차사격 샌드박스 (#232): 1이면 전원 운동장 스폰 + 더미 봇 1 + 나머지 봇 퇴장 + 몹 접촉 무해
      - DEV_CROSSFIRE_SANDBOX=${DEV_CROSSFIRE_SANDBOX:-0}
      # 몹 스폰 끄기 (촬영·PvP 검증용): 1이면 잔상을 전혀 세우지 않는다. 봇·폐쇄·전투는 그대로
      - DEV_NO_MONSTERS=${DEV_NO_MONSTERS:-0}
      # 탐사 모드: 1이면 1인 매치 + 봇·몹 전부 비활성 (맵 검증용)
      - SOLO_MAP_VALIDATION=${SOLO_MAP_VALIDATION:-0}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  ops_server:
    build:
      context: .
      dockerfile: ops_server/Dockerfile
    container_name: manitto-ops-server-dev
    ports:
      - "5000:8080"
    environment:
      - GameServerUrl=http://game_server:8080
      - ASPNETCORE_ENVIRONMENT=Development
      # Storylet CSV 편집툴이 호스트 레포의 CSV를 직접 읽고/쓰도록 마운트 경로 지정
      - CsvRoot=/app/csv
      # 아이템 스프라이트 서빙 경로(컨테이너엔 client/ 에셋이 없으므로 마운트한 경로를 직접 지정)
      - ItemSpritesRoot=/app/item-sprites
    volumes:
      # network/Common/csv를 컨테이너에 바인드 마운트(rw) → 에디터 저장이 레포 파일에 반영
      - ./network/Common/csv:/app/csv
      # 아이템 스프라이트(읽기 전용) → /item-sprites 정적 서빙 (스프라이트 미표시 버그 수정)
      - ./client/Assets/Resources/ItemSprites:/app/item-sprites:ro
      # 대시보드 정적 파일(읽기 전용) → 호스트 수정이 재빌드 없이 새로고침으로 반영 (UI 반복 개발용)
      - ./ops_server/wwwroot:/app/wwwroot:ro
    depends_on:
      - game_server
      - user_server
    restart: unless-stopped

volumes:
  redis-data-dev:
  match-summary-data-dev:
