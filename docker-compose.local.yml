# 앱 서비스는 container_name과 고정 host port를 사용하므로 이 파일 자체를 --scale 하지 않는다.
# 서버는 단일 노드 전제다 (수평 확장 계층은 #320에서 제거, 복원 태그 pre-stage2-scaling).
services:
  redis:
    image: redis:7-alpine
    container_name: manitto-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data-dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: manitto-nats-dev
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: "-m 8222 -js --store_dir /data"
    volumes:
      - nats-data-dev:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  game_server:
    build:
      context: .
      dockerfile: Dockerfile.game_server.dev
    container_name: manitto-game-server-dev
    ports:
      - "8080:8080"
      - "9001:9001"
    volumes:
      # Mount source code for hot reload
      - ./game_server:/App/game_server:rw
      - ./network:/App/network:rw
      # Exclude bin and obj directories to avoid conflicts
      - /App/game_server/bin
      - /App/game_server/obj
      - /App/network/bin
      - /App/network/obj
    environment:
      - gameServerId=game-server-0
      # 레지스트리에 광고하는 공개 주소 — 클라이언트가 실제로 접속하는 IP (#339)
      - GAME_SERVER_PUBLIC_HOST=${GAME_SERVER_IP:-192.168.0.167}
      - GAME_SERVER_PUBLIC_PORT=9001
      - redisEndPoints=redis:6379
      - natsEndPoint=nats://nats:4222
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  user_server:
    build:
      context: .
      dockerfile: Dockerfile.user_server.dev
    container_name: manitto-user-server-dev
    ports:
      - "7000:7000"
      - "8081:8080"
    volumes:
      # Mount source code for hot reload
      - ./user_server:/App/user_server:rw
      - ./network:/App/network:rw
      # Exclude bin and obj directories to avoid conflicts
      - /App/user_server/bin
      - /App/user_server/obj
      - /App/network/bin
      - /App/network/obj
    environment:
      # 매칭 리더 lease 값이자 세션 알림 origin. 노드마다 유일 (#339)
      - USER_SERVER_ID=user-server-0
      - servicePort=7000
      - redisEndPoints=redis:6379
      - natsEndPoint=nats://nats:4222
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - FORCE_PLAYER_JOB=${FORCE_PLAYER_JOB:-}
      - FORCE_PLAYER_SPAWN_AREA=${FORCE_PLAYER_SPAWN_AREA:-}
      # Survivor Royale 로컬: 실플레이어 1명 + 봇 7명 (1이면 실플레이어 2명 + 봇 6명)
      # 탐사 모드: 1이면 1인 매치 + 봇·몹 전부 비활성 (맵 검증용)
      - SOLO_MAP_VALIDATION=${SOLO_MAP_VALIDATION:-0}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped


volumes:
  redis-data-dev:
  nats-data-dev:
