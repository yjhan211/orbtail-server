<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manitto Ops Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-active   { border-left: 4px solid #22c55e; }
        .card-inactive { border-left: 4px solid #6b7280; }
        .bar-stamina   { background: #3b82f6; }
        .bar-corrupt   { background: #ef4444; }
        .status-ACTIVE    { color: #22c55e; }
        .status-TERMINAL  { color: #f97316; }
        .status-FREED     { color: #a855f7; }
        .status-ELIMINATED{ color: #6b7280; }
        .status-SPECTATING{ color: #6b7280; }
        /* 폐쇄 스케줄 */
        .closure-closed   { background: #374151; color: #9ca3af; }
        .closure-next     { background: #78350f; color: #fbbf24; border: 1px solid #d97706; }
        .closure-warning  { background: #7f1d1d; color: #f87171; border: 1px solid #ef4444; animation: pulse 1s infinite; }
        .closure-pending  { background: #1f2937; color: #4b5563; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
        /* 토스트 */
        #toast { transition: opacity 0.3s; }
        /* 이벤트 로그 타입별 색상 */
        .ev-MOVE      { color: #93c5fd; }
        .ev-RESOURCE  { color: #fcd34d; }
        .ev-MISSION   { color: #86efac; }
        .ev-INTERACT  { color: #c4b5fd; }
        .ev-ELIMINATE { color: #fca5a5; font-weight: bold; }
        .ev-CLOSURE   { color: #fb923c; }
        .ev-SYSTEM    { color: #9ca3af; font-style: italic; }
        .ev-bot       { background: rgba(168, 85, 247, 0.08); }
        .storylet-row.active { background: rgba(37, 99, 235, 0.22); border-color: #3b82f6; }
        .storylet-field textarea { min-height: 5.5rem; }
        .storylet-tag { background: #111827; border: 1px solid #374151; color: #cbd5e1; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-mono">

<!-- 헤더 -->
<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div>
        <h1 class="text-xl font-bold text-white">Manitto Ops Dashboard</h1>
        <p class="text-xs text-gray-400 mt-0.5">활성 인스턴스 + 플레이어 코어 모니터링</p>
    </div>
    <div class="text-right">
        <div id="summary" class="text-sm text-gray-300">--</div>
        <div id="last-update" class="text-xs text-gray-500 mt-0.5">마지막 업데이트: --</div>
    </div>
</header>

<!-- 토스트 알림 -->
<div id="toast" class="fixed top-6 right-6 z-50 hidden bg-green-800 text-green-100 px-4 py-2 rounded shadow-lg text-sm opacity-0"></div>

<!-- 본문 -->
<main class="p-6">

    <!-- ══ 글로벌 매칭 Config 패널 ══════════════════════════════════════════ -->
    <section class="bg-gray-900 border border-blue-900 rounded-lg p-5 mb-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-bold text-blue-300">글로벌 매칭 Config</h2>
            <span class="text-xs text-gray-500">진행 중 인스턴스에 영향 없음 — 다음 매칭부터 적용</span>
        </div>

        <!-- 현재 config 표시 -->
        <div id="config-status" class="text-xs text-gray-400 mb-4 bg-gray-800 rounded px-3 py-2">로딩 중...</div>

        <div class="grid grid-cols-1 gap-6">
            <!-- 폐쇄 Config -->
            <div>
                <h3 class="text-sm font-semibold text-gray-300 mb-3">폐쇄 타이밍</h3>
                <div class="flex flex-col gap-2">
                    <label class="text-xs text-gray-400">첫 폐쇄 딜레이 (초)
                        <input id="cfg-start-delay" type="number" min="0" value="300"
                               class="mt-1 w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm text-white" />
                    </label>
                    <label class="text-xs text-gray-400">폐쇄 간격 (초)
                        <input id="cfg-interval" type="number" min="1" value="180"
                               class="mt-1 w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm text-white" />
                    </label>
                    <div class="flex gap-2 mt-1">
                        <button onclick="applyClosureConfig()"
                                class="flex-1 bg-blue-700 hover:bg-blue-600 text-white text-xs px-3 py-1.5 rounded">
                            타이밍 적용
                        </button>
                        <button onclick="resetClosureConfig()"
                                class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded">
                            기본값 복원
                        </button>
                    </div>
                </div>

                <!-- 폐쇄 순서 -->
                <h3 class="text-sm font-semibold text-gray-300 mt-4 mb-2">폐쇄 순서</h3>
                <div class="flex gap-2 mb-2">
                    <label class="flex items-center gap-1 text-xs cursor-pointer">
                        <input type="radio" name="seq-mode" id="seq-random" value="random" checked
                               onchange="onSeqModeChange()" class="accent-blue-500" />
                        무작위 (기본)
                    </label>
                    <label class="flex items-center gap-1 text-xs cursor-pointer">
                        <input type="radio" name="seq-mode" id="seq-forced" value="forced"
                               onchange="onSeqModeChange()" class="accent-blue-500" />
                        강제 지정
                    </label>
                </div>
                <div id="seq-forced-panel" class="hidden">
                    <p class="text-xs text-gray-500 mb-1">폐쇄 대상 구역을 순서대로 선택 (아래 버튼 클릭으로 추가)</p>
                    <div class="flex flex-wrap gap-1 mb-2">
                        <!-- 폐쇄 가능 구역 버튼 -->
                        <button onclick="addSeqArea(10)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">행정실(10)</button>
                        <button onclick="addSeqArea(12)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">교무실(12)</button>
                        <button onclick="addSeqArea(20)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">보건실(20)</button>
                        <button onclick="addSeqArea(22)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">도서관(22)</button>
                        <button onclick="addSeqArea(30)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">2-1(30)</button>
                        <button onclick="addSeqArea(32)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">고사실(32)</button>
                        <button onclick="addSeqArea(40)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">3-1(40)</button>
                        <button onclick="addSeqArea(42)" class="seq-area-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">방송실(42)</button>
                    </div>
                    <div id="seq-list" class="text-xs text-yellow-300 mb-1 min-h-4">순서 없음</div>
                    <div class="flex gap-2">
                        <button onclick="applyForcedSequence()"
                                class="flex-1 bg-yellow-700 hover:bg-yellow-600 text-white text-xs px-3 py-1.5 rounded">
                            순서 적용
                        </button>
                        <button onclick="clearSeqList()"
                                class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded">
                            초기화
                        </button>
                    </div>
                </div>
            </div>




        </div>
    </section>

    <!-- 인스턴스 카드 그리드 -->
    <section id="instance-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mb-6">
        <div id="empty-state" class="col-span-full text-center text-gray-500 py-16">
            <p class="text-2xl mb-2">게임 인스턴스 없음</p>
            <p class="text-sm">활성 매칭이 시작되면 카드가 표시됩니다.</p>
        </div>
    </section>

    <!-- 플레이어 상세 영역 -->
    <section id="detail-section" class="hidden bg-gray-900 border border-gray-700 rounded-lg p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 id="detail-title" class="text-lg font-bold">인스턴스 상세</h2>
            <button onclick="closeDetail()" class="text-gray-400 hover:text-white text-sm">닫기 ✕</button>
        </div>

        <!-- 구역 폐쇄 스케줄 섹션 -->
        <div id="closure-section" class="mb-6">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">구역 폐쇄 스케줄</h3>
            <div id="closure-config-info" class="text-xs text-gray-500 mb-1 hidden"></div>
            <div id="closure-countdown" class="text-xs text-yellow-400 mb-2 hidden"></div>
            <div id="closure-sequence" class="flex flex-wrap gap-1"></div>
        </div>

        <!-- 플레이어 테이블 섹션 -->
        <div id="detail-content" class="overflow-x-auto">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">플레이어 상태</h3>
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-gray-400 border-b border-gray-700">
                        <th class="text-left pb-2">PlayerId</th>
                        <th class="text-left pb-2">구역</th>
                        <th class="text-left pb-2">스태미나</th>
                        <th class="text-left pb-2">오염도</th>
                        <th class="text-left pb-2">상태</th>
                        <th class="text-left pb-2">마니또</th>
                        <th class="text-left pb-2">타겟</th>
                    </tr>
                </thead>
                <tbody id="detail-tbody"></tbody>
            </table>
        </div>

        <!-- 진행 로그 패널 -->
        <div id="event-log-section" class="mt-6">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">진행 로그</h3>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" id="event-autoscroll" checked class="accent-blue-500" />
                        최신 자동 스크롤
                    </label>
                    <span id="event-count" class="text-xs text-gray-500">0건</span>
                </div>
            </div>
            <div id="event-log" class="bg-gray-950 border border-gray-800 rounded p-3 text-xs font-mono overflow-y-auto"
                 style="max-height: 320px;">
                <p class="text-gray-600">로그 대기 중...</p>
            </div>
        </div>
    </section>
</main>

<script src="app.js?v=ops-no-storylet-editor-20260701"></script>
</body>
</html>
