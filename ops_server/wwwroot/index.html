<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manitto Ops Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-active   { border-left: 4px solid #22c55e; }
        .card-inactive { border-left: 4px solid #6b7280; }
        .bar-stamina   { background: #3b82f6; }
        .bar-corrupt   { background: #ef4444; }
        .status-ACTIVE    { color: #22c55e; }
        .status-TERMINAL  { color: #f97316; }
        .status-FREED     { color: #a855f7; }
        .status-ELIMINATED{ color: #6b7280; }
        .status-SPECTATING{ color: #6b7280; }
        /* 폐쇄 스케줄 */
        .closure-closed   { background: #374151; color: #9ca3af; }
        .closure-next     { background: #78350f; color: #fbbf24; border: 1px solid #d97706; }
        .closure-warning  { background: #7f1d1d; color: #f87171; border: 1px solid #ef4444; animation: pulse 1s infinite; }
        .closure-pending  { background: #1f2937; color: #4b5563; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
        /* 미션 단계 */
        .step-done    { color: #22c55e; }
        .step-current { color: #facc15; font-weight: bold; }
        .step-future  { color: #4b5563; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-mono">

<!-- 헤더 -->
<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div>
        <h1 class="text-xl font-bold text-white">Manitto Ops Dashboard</h1>
        <p class="text-xs text-gray-400 mt-0.5">활성 인스턴스 + 플레이어 코어 모니터링</p>
    </div>
    <div class="text-right">
        <div id="summary" class="text-sm text-gray-300">--</div>
        <div id="last-update" class="text-xs text-gray-500 mt-0.5">마지막 업데이트: --</div>
    </div>
</header>

<!-- 본문 -->
<main class="p-6">
    <!-- 인스턴스 카드 그리드 -->
    <section id="instance-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mb-6">
        <div id="empty-state" class="col-span-full text-center text-gray-500 py-16">
            <p class="text-2xl mb-2">게임 인스턴스 없음</p>
            <p class="text-sm">활성 매칭이 시작되면 카드가 표시됩니다.</p>
        </div>
    </section>

    <!-- 플레이어 상세 영역 -->
    <section id="detail-section" class="hidden bg-gray-900 border border-gray-700 rounded-lg p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 id="detail-title" class="text-lg font-bold">인스턴스 상세</h2>
            <button onclick="closeDetail()" class="text-gray-400 hover:text-white text-sm">닫기 ✕</button>
        </div>

        <!-- 구역 폐쇄 스케줄 섹션 -->
        <div id="closure-section" class="mb-6">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">구역 폐쇄 스케줄</h3>
            <div id="closure-countdown" class="text-xs text-yellow-400 mb-2 hidden"></div>
            <div id="closure-sequence" class="flex flex-wrap gap-1"></div>
        </div>

        <!-- 플레이어 테이블 섹션 -->
        <div id="detail-content" class="overflow-x-auto">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">플레이어 상태</h3>
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-gray-400 border-b border-gray-700">
                        <th class="text-left pb-2">PlayerId</th>
                        <th class="text-left pb-2">직책</th>
                        <th class="text-left pb-2">구역</th>
                        <th class="text-left pb-2">스태미나</th>
                        <th class="text-left pb-2">오염도</th>
                        <th class="text-left pb-2">상태</th>
                        <th class="text-left pb-2">미션 단계</th>
                        <th class="text-left pb-2">마니또</th>
                        <th class="text-left pb-2">타겟</th>
                    </tr>
                </thead>
                <tbody id="detail-tbody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
